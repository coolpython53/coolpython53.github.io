<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            line-height: 1.6; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background-color: #f6f8fa; 
        }
        .content-card { 
            background: white; 
            border: 1px solid #d0d7de; 
            border-radius: 6px; 
            padding: 24px; 
            margin-bottom: 24px; 
        }
        h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h1 id="title-display">Home</h1>
    <div id="app-container"></div>

    <script>
        async function loadSite() {
            const container = document.getElementById('app-container');
            
            try {
                // Fetch the manifest from the root
                const response = await fetch('./manifest.json');
                const manifest = await response.json();
                
                // Update Page Title
                document.title = manifest.projectTitle;
                document.getElementById('title-display').textContent = manifest.projectTitle;

                for (const fileName of manifest.files) {
                    const filePath = `${manifest.contentFolder}/${fileName}`;
                    
                    // Create the wrapper for this file's content
                    const wrapper = document.createElement('div');
                    wrapper.className = 'content-card';
                    container.appendChild(wrapper);

                    // Fetch the actual file content
                    const fileContent = await fetch(filePath);
                    const text = await fileContent.text();

                    if (fileName.endsWith('.md')) {
                        // Render Markdown
                        wrapper.innerHTML = marked.parse(text);
                    } else {
                        // Render HTML
                        wrapper.innerHTML = text;
                    }
                }
            } catch (err) {
                container.innerHTML = `<p style="color:red;">Error loading manifest. Make sure your files are pushed to GitHub.</p>`;
                console.error(err);
            }
        }

        loadSite();
    </script>
</body>
</html>
