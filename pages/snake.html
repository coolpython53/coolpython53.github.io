<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Slither Pro</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --bg-dark: #050505;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(10px, 4vw, 25px);
            box-sizing: border-box;
            z-index: 10;
        }
        .stats {
            color: white;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #score-board {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 800;
            letter-spacing: 1px;
        }
        #controls-hint {
            font-size: clamp(10px, 2.5vw, 14px);
            opacity: 0.6;
            margin-top: 5px;
        }
        .minimap-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: clamp(80px, 20vw, 150px);
            height: clamp(80px, 20vw, 150px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.95);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            color: white;
            text-align: center;
            display: none;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            pointer-events: auto;
            width: min(90%, 400px);
            z-index: 100;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: clamp(24px, 8vw, 42px);
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .final-stats {
            font-size: clamp(16px, 4vw, 20px);
            margin: 20px 0;
            opacity: 0.9;
        }
        button {
            padding: 12px clamp(20px, 10vw, 40px);
            background: var(--neon-blue);
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }
        #boost-btn {
            position: absolute;
            bottom: clamp(20px, 10vh, 60px);
            left: 50%;
            transform: translateX(-50%);
            width: clamp(60px, 15vw, 90px);
            height: clamp(60px, 15vw, 90px);
            background: rgba(0, 242, 255, 0.2);
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            backdrop-filter: blur(4px);
            z-index: 20;
        }
        /* Only hide boost button if a fine pointer (mouse) is available */
        @media (pointer: fine) {
            #boost-btn { display: none; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats">
            <div id="score-board">LENGTH: <span id="score">25</span></div>
            <div id="controls-hint">STEER TOWARDS CURSOR • CLICK/SPACE TO BOOST</div>
        </div>
        
        <div class="minimap-container">
            <canvas id="minimap"></canvas>
        </div>
    </div>

    <div id="boost-btn">BOOST</div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>You hit the boundary of the neon world.</p>
        <div class="final-stats">Final Length: <span id="final-score">0</span></div>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap');
    const mctx = miniCanvas.getContext('2d');
    
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const gameOverEl = document.getElementById('game-over');
    const boostBtn = document.getElementById('boost-btn');

    // Configuration
    const WORLD_SIZE = 4000;
    const GRID_SIZE = 100;
    
    // State
    let width, height;
    let camera = { x: 0, y: 0 };
    let mouse = { x: 0, y: 0 };
    let isBoosting = false;
    let isDead = false;
    let food = [];
    
    const snake = {
        x: WORLD_SIZE / 2,
        y: WORLD_SIZE / 2,
        radius: 14,
        angle: 0,
        speed: 3.5,
        baseSpeed: 3.5,
        boostSpeed: 7,
        length: 25,
        history: [], 
        hue: 190
    };

    function init() {
        resize();
        
        // Populate initial food
        for(let i = 0; i < 600; i++) spawnFood();
        
        // Setup initial history
        resetGame();

        // Mouse inputs
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') isBoosting = true;
        });
        window.addEventListener('mouseup', () => isBoosting = false);
        
        // Touch inputs (improved for scaling)
        window.addEventListener('touchstart', e => {
            if (e.target === boostBtn) {
                isBoosting = true;
            } else {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: false });
        
        window.addEventListener('touchmove', e => {
            if (e.target !== boostBtn) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
            e.preventDefault(); // Prevent scrolling while playing
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if ([...e.changedTouches].some(t => t.target === boostBtn)) {
                isBoosting = false;
            }
        });

        // Keyboard inputs
        window.addEventListener('keydown', e => { if(e.code === 'Space' || e.code === 'ShiftLeft') isBoosting = true; });
        window.addEventListener('keyup', e => { if(e.code === 'Space' || e.code === 'ShiftLeft') isBoosting = false; });
        
        // Handle screen resizing
        window.addEventListener('resize', resize);

        requestAnimationFrame(gameLoop);
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        
        // Fix for minimap pixel density
        const miniSize = miniCanvas.clientWidth;
        miniCanvas.width = miniSize;
        miniCanvas.height = miniSize;

        // Reset mouse to center to prevent spinning on load
        mouse.x = width / 2;
        mouse.y = height / 2;
    }

    function resetGame() {
        isDead = false;
        gameOverEl.style.display = 'none';
        snake.x = WORLD_SIZE / 2;
        snake.y = WORLD_SIZE / 2;
        snake.length = 25;
        snake.radius = 14;
        snake.angle = 0;
        snake.history = [];
        
        // Center the mouse on reset
        mouse.x = width / 2;
        mouse.y = height / 2;

        for(let i = 0; i < 500; i++) {
            snake.history.push({x: snake.x, y: snake.y});
        }
    }

    function spawnFood() {
        food.push({
            x: Math.random() * WORLD_SIZE,
            y: Math.random() * WORLD_SIZE,
            radius: Math.random() * 4 + 3,
            hue: Math.random() * 80 + 160,
            pulse: Math.random() * Math.PI
        });
    }

    function update() {
        if (isDead) return;

        // Dynamic Steering - relative to screen center
        // Using screen-space coordinates for steering
        const dx = mouse.x - width / 2;
        const dy = mouse.y - height / 2;
        
        // Only steer if the mouse/touch is far enough from center to avoid jitter
        if (Math.hypot(dx, dy) > 10) {
            const targetAngle = Math.atan2(dy, dx);
            let diff = targetAngle - snake.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            snake.angle += diff * 0.12;
        }

        // Speed logic
        if (isBoosting && snake.length > 15) {
            snake.speed = snake.boostSpeed;
            if (Math.random() > 0.8) snake.length -= 0.1;
        } else {
            snake.speed = snake.baseSpeed;
        }

        // Update position
        snake.x += Math.cos(snake.angle) * snake.speed;
        snake.y += Math.sin(snake.angle) * snake.speed;

        // Path history (optimized for length)
        snake.history.unshift({ x: snake.x, y: snake.y });
        const maxHistory = Math.floor(snake.length * 6) + 100;
        if (snake.history.length > maxHistory) snake.history.length = maxHistory;

        // Camera smoothing
        camera.x += (snake.x - width / 2 - camera.x) * 0.1;
        camera.y += (snake.y - height / 2 - camera.y) * 0.1;

        // Boundary check
        if (snake.x < 0 || snake.x > WORLD_SIZE || snake.y < 0 || snake.y > WORLD_SIZE) {
            endGame();
        }

        // Food collision logic
        for (let i = food.length - 1; i >= 0; i--) {
            const f = food[i];
            // Simple distance check
            const distSq = (f.x - snake.x)**2 + (f.y - snake.y)**2;
            const minDist = (snake.radius + f.radius)**2;
            
            if (distSq < minDist) {
                snake.length += f.radius * 0.4;
                snake.radius = Math.min(35, 14 + (snake.length / 80));
                food.splice(i, 1);
                spawnFood();
            }
        }

        scoreEl.innerText = Math.floor(snake.length);
    }

    function endGame() {
        isDead = true;
        finalScoreEl.innerText = Math.floor(snake.length);
        gameOverEl.style.display = 'block';
    }

    function drawMinimap() {
        mctx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
        const scale = miniCanvas.width / WORLD_SIZE;
        
        mctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        mctx.strokeRect(0, 0, miniCanvas.width, miniCanvas.height);

        mctx.fillStyle = '#00f2ff';
        mctx.beginPath();
        mctx.arc(snake.x * scale, snake.y * scale, 2.5, 0, Math.PI * 2);
        mctx.fill();
    }

    function draw() {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw Grid Lines (Limited to viewport for performance)
        ctx.beginPath();
        ctx.strokeStyle = '#0f0f15';
        ctx.lineWidth = 1;
        
        const startX = Math.floor(camera.x / GRID_SIZE) * GRID_SIZE;
        const endX = startX + width + GRID_SIZE * 2;
        const startY = Math.floor(camera.y / GRID_SIZE) * GRID_SIZE;
        const endY = startY + height + GRID_SIZE * 2;

        for (let x = Math.max(0, startX); x <= Math.min(WORLD_SIZE, endX); x += GRID_SIZE) {
            ctx.moveTo(x, Math.max(0, startY)); ctx.lineTo(x, Math.min(WORLD_SIZE, endY));
        }
        for (let y = Math.max(0, startY); y <= Math.min(WORLD_SIZE, endY); y += GRID_SIZE) {
            ctx.moveTo(Math.max(0, startX), y); ctx.lineTo(Math.min(WORLD_SIZE, endX), y);
        }
        ctx.stroke();

        // Border
        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 6;
        ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // Draw Food
        food.forEach(f => {
            // Only draw if in view
            if (f.x + 20 > camera.x && f.x - 20 < camera.x + width && 
                f.y + 20 > camera.y && f.y - 20 < camera.y + height) {
                f.pulse += 0.05;
                const size = f.radius + Math.sin(f.pulse) * 1.5;
                ctx.beginPath();
                ctx.arc(f.x, f.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${f.hue}, 100%, 60%)`;
                ctx.fill();
            }
        });

        // Draw Snake
        const spacing = 5;
        const totalSegments = Math.floor(snake.length);
        
        for (let i = totalSegments; i >= 0; i--) {
            const index = i * spacing;
            const pos = snake.history[index] || snake.history[snake.history.length - 1];
            
            // Only draw if in view
            if (pos.x + 50 > camera.x && pos.x - 50 < camera.x + width && 
                pos.y + 50 > camera.y && pos.y - 50 < camera.y + height) {
                
                const sizeMod = Math.max(0.25, 1 - (i / (totalSegments * 1.3)));
                const r = snake.radius * sizeMod;
                const hue = (snake.hue + (i * 1.2)) % 360;
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${hue}, 85%, ${i === 0 ? 65 : 50}%)`;
                ctx.fill();

                // Eye Detail for head
                if (i === 0) {
                    const eO = r * 0.5;
                    const eS = r * 0.35;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(pos.x + Math.cos(snake.angle - 0.6) * eO, pos.y + Math.sin(snake.angle - 0.6) * eO, eS, 0, Math.PI * 2);
                    ctx.arc(pos.x + Math.cos(snake.angle + 0.6) * eO, pos.y + Math.sin(snake.angle + 0.6) * eO, eS, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(pos.x + Math.cos(snake.angle - 0.55) * eO + Math.cos(snake.angle) * eS * 0.3, pos.y + Math.sin(snake.angle - 0.55) * eO + Math.sin(snake.angle) * eS * 0.3, eS * 0.5, 0, Math.PI * 2);
                    ctx.arc(pos.x + Math.cos(snake.angle + 0.55) * eO + Math.cos(snake.angle) * eS * 0.3, pos.y + Math.sin(snake.angle + 0.55) * eO + Math.sin(snake.angle) * eS * 0.3, eS * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        ctx.restore();
        drawMinimap();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Start on load
    window.onload = init;
</script>
</body>
</html>
